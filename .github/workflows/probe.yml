name: Sonda de fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SoooshBot/0.1 (buscador de ofertas; lectura de APIs publicas)"
          for u in "https://www.getonbrd.com/api/v0/search/jobs?query=&per_page=1&page=1" "https://www.getonbrd.com/api/v0/search/jobs?query=&per_page=100&page=1&expand=%5Bcompany%5D" "https://www.getonbrd.com/api/v0/categories/programming/jobs?per_page=1" "https://www.getonbrd.com/api/v0/categories/programming/jobs?per_page=100&page=1&expand=%5Bcompany%5D"; do
            echo "=== $u"; curl -s -m 30 -A "$UA" -H "Accept: application/json" -D - -o /tmp/b.txt "$u" | grep -iE "^HTTP"; head -c 120 /tmp/b.txt | tr '\n' ' '; echo; sleep 3
          done
