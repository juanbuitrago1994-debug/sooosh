name: Sonda de fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SoooshBot/0.1 (buscador de ofertas; lectura de APIs publicas)"
          B="https://www.getonbrd.com/api/v0/search/jobs"
          E="expand%5B%5D=company&expand%5B%5D=seniority&expand%5B%5D=modality&expand%5B%5D=tags"
          for u in "$B?query=&per_page=100&page=1&$E" "$B?query=&per_page=100&page=1" "$B?query=&per_page=50&page=1&expand%5B%5D=company" "$B?query=&per_page=10&page=1&$E"; do
            echo "=== $u"; curl -s -m 40 -A "$UA" -H "Accept: application/json" -D /tmp/h.txt -o /tmp/b.txt "$u"; head -1 /tmp/h.txt; grep -iE "^(server|cf-mitigated|retry-after|content-type)" /tmp/h.txt | tr '\n' ' '; head -c 140 /tmp/b.txt | tr '\n' ' '; echo; sleep 4
          done
          echo "=== ashby x6 seguidas"
          for t in addi mural nubank toku belvo paxos; do printf "$t "; curl -s -m 25 -A "$UA" -o /dev/null -w "%{http_code}\n" "https://api.ashbyhq.com/posting-api/job-board/$t"; sleep 1.5; done
