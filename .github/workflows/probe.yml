name: Sonda de fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="SoooshBot/0.1 (buscador de ofertas; lectura de APIs publicas)"
          for u in "https://www.getonbrd.com/api/v0/categories/programming/jobs?per_page=1" "https://api.ashbyhq.com/posting-api/job-board/addi" "https://apply.workable.com/api/v1/widget/accounts/platzi?details=true" "https://himalayas.app/jobs/api/search?country=CO&page=1" "https://boards-api.greenhouse.io/v1/boards/cabify/jobs"; do
            echo "=== $u"; curl -s -m 25 -A "$UA" -D - -o /tmp/b.txt "$u" | grep -iE "^HTTP|server:|cf-ray|retry-after|x-ratelimit|content-type"; head -c 160 /tmp/b.txt | tr '\n' ' '; echo; sleep 2
          done
