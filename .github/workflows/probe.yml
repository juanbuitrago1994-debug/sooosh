name: Sonda de fuentes (temporal)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          cat > /tmp/p.mjs <<'JS'
          const UA = "SoooshBot/0.1 (buscador de ofertas; lectura de APIs publicas)"
          const urls = ["https://www.getonbrd.com/api/v0/search/jobs?query=&per_page=10&page=1", "https://api.ashbyhq.com/posting-api/job-board/addi", "https://apply.workable.com/api/v1/widget/accounts/platzi?details=true"]
          for (const u of urls) {
            for (const [name, headers] of [["node UA+Accept", { "User-Agent": UA, Accept: "application/json" }], ["node solo UA", { "User-Agent": UA }], ["node sin cabeceras", {}]]) {
              const r = await fetch(u, { headers }); console.log(new URL(u).hostname, name, r.status, r.headers.get("cf-mitigated") ?? "", r.headers.get("server") ?? "")
              await new Promise((x) => setTimeout(x, 2500))
            }
          }
          JS
          node /tmp/p.mjs
