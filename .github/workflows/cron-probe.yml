# Sonda TEMPORAL: comprueba si GitHub dispara crons en este repositorio (se borra tras la prueba).
name: Sonda de cron (temporal)
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "cron disparado $(date -u +%FT%TZ)"
